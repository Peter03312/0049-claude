services:
  api:
    build: ./backend
    container_name: leafcards-api
    environment:
      DB_PATH: /data/leafcards.db
    volumes:
      - api-data:/data
    ports:
      # 宿主端口可用 API_PORT 覆盖：API_PORT=9000 docker compose up
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build: ./web
    container_name: leafcards-web
    depends_on:
      - api
    ports:
      # 宿主端口可用 WEB_PORT 覆盖：WEB_PORT=9090 docker compose up
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  api-data:
